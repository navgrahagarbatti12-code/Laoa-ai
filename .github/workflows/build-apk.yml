name: Build OpenDroid APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup project
        run: |
          unzip -o opendroid-main.zip
          shopt -s dotglob
          mv opendroid-main/* . || true
          rm -rf opendroid-main
          ls -la
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenDroid-APK
          path: app/build/outputs/apk/debug/*.apk
